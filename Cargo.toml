[package]
name = "greppy-rift-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal native copy-on-write snapshots for Greppy agent workspaces"
repository = "https://github.com/mkh-welsch/rift"
readme = "README.md"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[target.'cfg(target_os = "linux")'.dependencies]
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
