name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  linux-filesystem:
    name: Linux ${{ matrix.filesystem }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        filesystem: [btrfs, xfs-reflink, ext4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs xfsprogs e2fsprogs
      - name: Run native filesystem contract
        run: bash scripts/ci/linux-fs.sh "${{ matrix.filesystem }}"
